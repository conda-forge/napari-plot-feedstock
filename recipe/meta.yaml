{% set name = "napari-plot" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/napari_plot-{{ version }}.tar.gz
  sha256: c2e20ada0248f3045aa6e8e208fc1246f4ca140d10bf0d8eab57bd137af3b740

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.7
    - setuptools-scm
  run:
    - napari ==0.4.14
    - napari-plugin-engine >=0.1.4
    - numpy
    - python >=3.7
    - qtawesome
    - qtpy

test:
  imports:
    - napari_plot
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/lukasz-migas/napari-1d
  summary: Plugin providing support for 1d plotting in napari.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - lukasz-migas
